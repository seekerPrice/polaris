[project]
name = "polaris"
version = "0.1.0"
description = "Auto-generates AI agent security policies from compliance documents."
requires-python = ">=3.11"
dependencies = [
  "google-genai>=0.5.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pypdf>=5.0",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "sse-starlette>=2.1",
  "aiosqlite>=0.20",
  "aiofiles>=24.1",
  "reportlab>=4.2",
  "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.7",
  "mypy>=1.13",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
